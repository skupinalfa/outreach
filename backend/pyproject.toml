[project]
name = "coldmail-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "pydantic[email]==2.10.4",
  "pydantic-settings==2.7.1",
  "httpx==0.28.1",
  # 1.68+ is the first release with `client.responses.create` (the Responses API
  # with the `web_search` tool). Anything older raises AttributeError at call time.
  "openai>=1.68,<2.0",
  "bcrypt==4.2.1",
  "cryptography==44.0.0",
  "python-multipart==0.0.20",
  "tenacity==9.0.0",
  "structlog==24.4.0",
  "python-dotenv==1.0.1",
  "aiosmtpd==1.4.6",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "vcrpy==6.0.2",
  "testcontainers[postgres]==4.9.0",
  "ruff==0.8.4",
  "mypy==1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PT", "RET", "TC"]
ignore = [
  "E501",   # line length handled by formatter
  "B008",   # `Depends(...)` in argument defaults is the standard FastAPI pattern
  "TC001",  # `from __future__ import annotations` makes runtime imports harmless
  "TC002",
  "TC003",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: hits real external services; skipped unless LIVE_INTEGRATION=1",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
