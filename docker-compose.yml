services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coldmail
      POSTGRES_PASSWORD: coldmail
      POSTGRES_DB: coldmail
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldmail -d coldmail"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://coldmail:coldmail@postgres:5432/coldmail
      UV_PROJECT_ENVIRONMENT: /opt/venv
    ports:
      - "8000:8000"
    command: sh -c "uv sync && uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - backend_venv:/opt/venv

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://backend:8000
      NODE_ENV: development
    ports:
      - "3000:3000"
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  pg_data:
  backend_venv:
  frontend_node_modules:
  frontend_next:
